<svg xmlns="http://www.w3.org/2000/svg" width="830" height="626" viewBox="0 0 830 626"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a869a"/></marker></defs><text x="40" y="26" fill="#7a869a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="bold" text-anchor="start">롤백 — 새 펌웨어가 부팅에 실패하면 되돌린다</text><text x="40" y="44" fill="#7a869a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">CRC 는 '플래시가 온전한가' 만 본다. '실제로 도는가' 는 아래 두 카운터가 본다.</text><rect x="40" y="68" width="300" height="44" rx="4" fill="#8d99ae"/><text x="190.0" y="94" fill="#e8eaed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">부팅. 부트로더가 판정한다</text><line x1="190.0" y1="116" x2="190.0" y2="134" stroke="#7a869a" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="138" width="300" height="44" rx="4" fill="#3d5a80"/><text x="190.0" y="164" fill="#e8eaed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">fault_cnt &gt;= 3 ?</text><text x="354" y="164.0" fill="#7a869a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">폴트 리셋이 연속 3회</text><line x1="190.0" y1="186" x2="190.0" y2="204" stroke="#7a869a" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="208" width="300" height="44" rx="4" fill="#3d5a80"/><text x="190.0" y="234" fill="#e8eaed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">boot_try &gt;= 3 ?</text><text x="354" y="234.0" fill="#7a869a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">앱이 10초를 못 버팀</text><line x1="190.0" y1="256" x2="190.0" y2="274" stroke="#7a869a" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="278" width="300" height="44" rx="4" fill="#8d99ae"/><text x="190.0" y="304" fill="#e8eaed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">bootGetRollbackSlot()</text><text x="354" y="304.0" fill="#7a869a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">FIRM 보다 seq 가 작은 유효 슬롯</text><line x1="190.0" y1="326" x2="190.0" y2="344" stroke="#7a869a" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="348" width="300" height="44" rx="4" fill="#2a9d8f"/><text x="190.0" y="374" fill="#e8eaed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">bootApplySlot() → FIRM</text><text x="354" y="374.0" fill="#7a869a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">되돌아간다</text><line x1="190.0" y1="396" x2="190.0" y2="414" stroke="#7a869a" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="418" width="300" height="44" rx="4" fill="#b0413e"/><text x="190.0" y="444" fill="#e8eaed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">실패한 슬롯 무효화</text><text x="354" y="444.0" fill="#7a869a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">같은 것을 다시 적용하지 않게</text><line x1="190.0" y1="466" x2="190.0" y2="484" stroke="#7a869a" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="488" width="300" height="44" rx="4" fill="#2a9d8f"/><text x="190.0" y="514" fill="#e8eaed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">bootJumpFirm()</text><line x1="590" y1="300.0" x2="618" y2="300.0" stroke="#7a869a" stroke-width="1.5" marker-end="url(#a)"/><rect x="624" y="278" width="170" height="44" rx="4" fill="#b0413e"/><text x="709.0" y="304" fill="#e8eaed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">없으면 UF2 모드</text><text x="40" y="610" fill="#7a869a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="start">되돌아갈 곳이 없으면(-1) 무한 롤백 대신 UF2 모드로 빠진다. 사용자가 직접 넣게 한다.</text></svg>