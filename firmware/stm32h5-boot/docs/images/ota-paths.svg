<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="640" viewBox="0 0 1020 640"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a869a"/></marker></defs><text x="40" y="26" fill="#7a869a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="bold" text-anchor="start">업데이트 경로 — 전송만 다르고 나머지는 하나다</text><text x="40" y="44" fill="#7a869a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">cmd.c 가 전송계층과 무관해서, 새 경로는 여섯 함수(open/close/available/flush/read/write)만 채우면 된다.</text><text x="40" y="62" fill="#7a869a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">이더넷 OTA 가 drv_tcp.c 하나로 끝난 이유다. 부트로더는 손댄 것이 없다.</text><text x="135.0" y="78" fill="#7a869a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="middle">호스트</text><text x="357.0" y="78" fill="#7a869a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="middle">채널 드라이버</text><text x="625" y="78" fill="#7a869a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="middle">공용</text><rect x="40" y="92" width="190" height="40" rx="4" fill="#8d99ae"/><text x="135.0" y="116" fill="#e8eaed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">download.py --tcp</text><rect x="262" y="92" width="190" height="40" rx="4" fill="#3d5a80"/><text x="357.0" y="109" fill="#e8eaed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="middle">drv_tcp.c</text><text x="357.0" y="122" fill="#e8eaed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="middle">TCP 5301</text><line x1="234" y1="112.0" x2="256" y2="112.0" stroke="#7a869a" stroke-width="1.5" marker-end="url(#a)"/><path d="M456 112.0 H490 V190.0" fill="none" stroke="#7a869a" stroke-width="1.5"/><rect x="40" y="144" width="190" height="40" rx="4" fill="#8d99ae"/><text x="135.0" y="168" fill="#e8eaed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">download.py</text><rect x="262" y="144" width="190" height="40" rx="4" fill="#3d5a80"/><text x="357.0" y="161" fill="#e8eaed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="middle">drv_usb.c</text><text x="357.0" y="174" fill="#e8eaed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="middle">USB CDC</text><line x1="234" y1="164.0" x2="256" y2="164.0" stroke="#7a869a" stroke-width="1.5" marker-end="url(#a)"/><path d="M456 164.0 H490 V190.0" fill="none" stroke="#7a869a" stroke-width="1.5"/><rect x="40" y="196" width="190" height="40" rx="4" fill="#8d99ae"/><text x="135.0" y="220" fill="#e8eaed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">웹페이지 (USB)</text><rect x="262" y="196" width="190" height="40" rx="4" fill="#3d5a80"/><text x="357.0" y="213" fill="#e8eaed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="middle">drv_hid.c</text><text x="357.0" y="226" fill="#e8eaed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="middle">USB HID</text><line x1="234" y1="216.0" x2="256" y2="216.0" stroke="#7a869a" stroke-width="1.5" marker-end="url(#a)"/><path d="M456 216.0 H490 V190.0" fill="none" stroke="#7a869a" stroke-width="1.5"/><rect x="40" y="248" width="190" height="40" rx="4" fill="#8d99ae"/><text x="135.0" y="272" fill="#e8eaed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">웹페이지 (보드)</text><rect x="262" y="248" width="190" height="40" rx="4" fill="#3d5a80"/><text x="357.0" y="265" fill="#e8eaed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="middle">net_http.c</text><text x="357.0" y="278" fill="#e8eaed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="middle">POST /cmd</text><line x1="234" y1="268.0" x2="256" y2="268.0" stroke="#7a869a" stroke-width="1.5" marker-end="url(#a)"/><path d="M456 268.0 H490 V190.0" fill="none" stroke="#7a869a" stroke-width="1.5"/><line x1="490" y1="190.0" x2="514" y2="190.0" stroke="#7a869a" stroke-width="1.5" marker-end="url(#a)"/><rect x="520" y="144.0" width="210" height="40" rx="4" fill="#2a9d8f"/><text x="625.0" y="168" fill="#e8eaed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">cmd.c</text><rect x="520" y="188.0" width="210" height="40" rx="4" fill="#2a9d8f"/><text x="625.0" y="212" fill="#e8eaed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">cmd_boot.c</text><text x="625" y="250.0" fill="#7a869a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="middle">커맨드 셋 하나</text><text x="625" y="266.0" fill="#7a869a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="middle">FW_BEGIN / ERASE / WRITE</text><text x="625" y="280.0" fill="#7a869a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="middle">END / VERIFY / UPDATE</text><line x1="734" y1="164.0" x2="770" y2="164.0" stroke="#7a869a" stroke-width="1.5" marker-end="url(#a)"/><rect x="776" y="144.0" width="150" height="84" rx="4" fill="#b0413e"/><text x="851.0" y="182" fill="#e8eaed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">슬롯</text><text x="851.0" y="198" fill="#e8eaed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">(뱅크2)</text><text x="40" y="380" fill="#7a869a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="bold" text-anchor="start">적용은 두 단계 — 앱은 자기가 실행 중인 뱅크1 을 지울 수 없다</text><text x="40" y="398" fill="#7a869a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">그래서 앱은 슬롯에 받아두기만 하고, 실제 교체는 다음 부팅에 부트로더가 한다.</text><rect x="40" y="428" width="200" height="58" rx="4" fill="#2a9d8f"/><text x="140.0" y="454" fill="#e8eaed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">① 앱</text><text x="140.0" y="468" fill="#e8eaed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">슬롯에 기록 + 태그</text><line x1="246" y1="457" x2="282" y2="457" stroke="#7a869a" stroke-width="1.5" marker-end="url(#a)"/><rect x="288" y="428" width="200" height="58" rx="4" fill="#3d5a80"/><text x="388.0" y="454" fill="#e8eaed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">② resetToUpdate()</text><text x="388.0" y="468" fill="#e8eaed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">리셋</text><line x1="494" y1="457" x2="530" y2="457" stroke="#7a869a" stroke-width="1.5" marker-end="url(#a)"/><rect x="536" y="428" width="200" height="58" rx="4" fill="#8d99ae"/><text x="636.0" y="454" fill="#e8eaed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">③ 부트로더</text><text x="636.0" y="468" fill="#e8eaed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">bootApplySlot()</text><line x1="742" y1="457" x2="778" y2="457" stroke="#7a869a" stroke-width="1.5" marker-end="url(#a)"/><rect x="784" y="428" width="200" height="58" rx="4" fill="#2a9d8f"/><text x="884.0" y="454" fill="#e8eaed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">④ 새 앱 실행</text><text x="884.0" y="468" fill="#e8eaed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">10초 뒤 확정</text><text x="40" y="520" fill="#7a869a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">부트로더 모드에서는 ①~③ 이 한 번에 끝난다. 지울 뱅크를 실행 중이 아니기 때문이다.</text><text x="40" y="538" fill="#7a869a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">④ 에서 10초를 못 버티면 boot_try 가 쌓이고, 3회면 되돌린다(08 문서).</text><text x="40" y="564" fill="#7a869a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="bold" text-anchor="start">실측  USB CDC 140 KB/s   ·   이더넷 TCP 90 KB/s   ·   USB HID 35 KB/s</text></svg>