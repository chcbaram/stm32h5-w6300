<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="534" viewBox="0 0 1000 534"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a869a"/></marker></defs><text x="40" y="26" fill="#7a869a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="bold" text-anchor="start">폴트 자동 복구 — 반복해서 죽는 펌웨어를 되돌린다</text><text x="40" y="44" fill="#7a869a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">한 번의 폴트로는 되돌리지 않는다. 연속 3회여야 한다.</text><text x="40" y="62" fill="#7a869a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">확정에 성공하면 카운터가 0 이 되므로, 오래 잘 돌다 나는 드문 폴트로는 롤백되지 않는다.</text><rect x="150" y="88" width="420" height="46" rx="4" fill="#2a9d8f"/><text x="360.0" y="115" fill="#e8eaed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">① 앱 실행</text><text x="586" y="115.0" fill="#7a869a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">하드폴트 (없는 주소 접근 등)</text><line x1="360.0" y1="138" x2="360.0" y2="160" stroke="#7a869a" stroke-width="1.5" marker-end="url(#a)"/><rect x="150" y="164" width="420" height="46" rx="4" fill="#b0413e"/><text x="360.0" y="191" fill="#e8eaed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">② faultReset()</text><text x="586" y="191.0" fill="#7a869a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">.noinit 에 R0~PSR · RTC 백업에 fault_cnt++ · 리셋</text><line x1="360.0" y1="214" x2="360.0" y2="236" stroke="#7a869a" stroke-width="1.5" marker-end="url(#a)"/><rect x="150" y="240" width="420" height="46" rx="4" fill="#3d5a80"/><text x="360.0" y="267" fill="#e8eaed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">③ 부트로더 : fault_cnt 확인</text><text x="586" y="267.0" fill="#7a869a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">백업 레지스터라 리셋에도 살아남는다</text><line x1="360.0" y1="290" x2="360.0" y2="312" stroke="#7a869a" stroke-width="1.5" marker-end="url(#a)"/><rect x="150" y="316" width="420" height="46" rx="4" fill="#8d99ae"/><text x="360.0" y="343" fill="#e8eaed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">④ 롤백 + FAULT_RECOVER 기록 + 카운터 0</text><text x="586" y="343.0" fill="#7a869a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">fault_cnt &gt;= 3 일 때만</text><line x1="360.0" y1="366" x2="360.0" y2="388" stroke="#7a869a" stroke-width="1.5" marker-end="url(#a)"/><rect x="150" y="392" width="420" height="46" rx="4" fill="#2a9d8f"/><text x="360.0" y="419" fill="#e8eaed" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">⑤ 앱이 10초 버팀 → resetConfirmBoot()</text><text x="586" y="419.0" fill="#7a869a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">fault_cnt = 0 · boot_try = 0</text><path d="M150 263.0 H128 V111.0 H144" fill="none" stroke="#7a869a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="122" y="187.0" fill="#7a869a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="end">3회 미만이면</text><text x="122" y="200.0" fill="#7a869a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="end">그냥 점프</text><text x="40" y="518" fill="#7a869a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="start">카운터는 RTC 백업 레지스터에 둔다. .noinit 은 SRAM 이라 전원을 뽑으면 사라진다.</text></svg>